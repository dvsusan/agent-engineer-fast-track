[project]
name = "datapilot-langchain-capabilities"
version = "0.1.0"
description = "Chapter 41 LangChain model, tool, orchestration and output parsing demo"
requires-python = ">=3.15"
dependencies = [
    # 只装底层组合组件和 OpenAI 兼容客户端，不引入会隐藏工具执行过程的高层 Agent。
    "langchain-core>=1.8,<2",
    "langchain-openai>=1.8,<2",
    # pandas 负责确定性计算；模型不能替代缺失值、重复值和价格区间的处理规则。
    "pandas>=2.3,<4",
    "python-dotenv>=1.2,<2",
]
